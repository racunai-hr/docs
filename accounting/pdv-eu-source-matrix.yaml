version: 2.0.0
status: Locked
owner: Accounting
last_reviewed: '2026-11-27'

events:
  - event_id: EU_GOODS_ACQUISITION
    name: EU stjecanje dobara
    source: tax_fact_or_journal
    example: Sintetički dobavljač DE, 8.000 EUR neto, stjecanje po stopi 25 %
    boxes: [205, 206, 207, 305, 306, 307]
    accounts:
      asset: '0373'
      pretporez: '14020-14022'
      obveza: '24020-24022'
    vat_rate: 0.25
    notes: >
      Izvor je potvrđena porezna činjenica (vrsta isporuke, porezni datum, postupak, stopa) ili temeljnica
      na EU kontima. Stopa određuje polje: 5 % II.5/III.5, 13 % II.6/III.6, 25 % II.7/III.7.
      Konto 0373 bez EU retka u istoj temeljnici nije dokaz stjecanja i traži pregled.
      Mapiranje usklađeno sa službenim opisom elemenata XML sheme PDV v11.0 (2026-11-27) uz
      autorizaciju vlasnika; zasebna potvrda računovođe još nije evidentirana.

  - event_id: EU_SERVICES_RECEIVED
    name: Primljene usluge iz EU
    source: tax_fact_or_journal
    boxes: [208, 209, 210, 308, 309, 310]
    accounts:
      pretporez: '14030-14032'
      obveza: '24030-24032'
    vat_rate: 0.25
    notes: >
      5 % II.8/III.8, 13 % II.9/III.9, 25 % II.10/III.10. Porezni datum je dan obavljanja usluge.

  - event_id: DOMESTIC_REVERSE_CHARGE
    name: Tuzemni prijenos porezne obveze (primljene isporuke)
    source: manual_journal_entry
    boxes: [204, 304]
    accounts:
      pretporez: '1401'
      obveza: '2401'
    vat_rate: 0.25
    notes: >
      II.4 i III.4. Ne ulazi u PDV-S. OSS, prodaja na daljinu, elektroničko sučelje i IOSS nemaju
      automatsko polje na Obrascu PDV i traže računovodstveni pregled.

account_ranges:
  eu_goods_pretporez: '14020-14022'
  eu_goods_obveza: '24020-24022'
  eu_services_pretporez: '14030-14032'
  eu_services_obveza: '24030-24032'
  domestic_reverse_charge_pretporez: '1401-14011'
  domestic_reverse_charge_obveza: '2401-24011'

invariants:
  - id: I1
    rule: '207.base >= 0'
  - id: I2
    rule: '207.vat == round(207.base * 0.25, 2); 206: 0.13; 205: 0.05'
  - id: I3
    rule: '207.vat == 307.vat and 207.base == 307.base'
  - id: I4
    rule: '400 unchanged when 207/307 net zero (RC neutral)'

dedup:
  - rule_id: EU_SUPPLIER_ZERO_VAT_EXCLUDE_303
    event_id: EU_GOODS_ACQUISITION
    action: exclude_from_box_303
    notes: >
      Račun EU dobavljača s 0% PDV (isporuka u RH) ne smije ulaziti u box 303 kao domaći pretporez.
  - rule_id: JE_EU_VAT_SKIP_EXPENSE_DUP
    event_id: EU_GOODS_ACQUISITION
    action: skip_if_expense_source
    notes: >
      Ako isti događaj već proizlazi iz expense modula, preskoči duplikat iz journal entry izvora.

references:
  - docs/accounting/uvoz-vozila-knjizenje.md
  - docs/tax/pdv-s/IMPLEMENTATION.md
